# Use with docker compose (GitHub Actions) or podman-compose (local development)
# IMPORTANT: GitHub Actions uses Docker, local development uses Podman
# NOTE: Modern Docker uses 'docker compose' (without hyphen), older versions use 'docker-compose'

services:
  cats-dogs-classifier:
    image: cats-dogs-classifier:latest
    container_name: cats-dogs-classifier
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/saved_models/best_model.pt
      - CONFIG_PATH=/app/configs/model_config.yaml
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models/saved_models:/app/models/saved_models:ro
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - cats-dogs-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cats-dogs-network:
    driver: bridge

volumes:
  logs:
