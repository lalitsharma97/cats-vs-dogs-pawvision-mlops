# Model Configuration
model:
  name: "baseline_cnn"
  architecture: "simple_cnn"
  input_size: [224, 224, 3]
  num_classes: 2
  class_names: ["cat", "dog"]

# Hyperparameters
training:
  batch_size: 16
  learning_rate: 0.001
  epochs: 5
  optimizer: "adam"
  loss_function: "binary_crossentropy"

# Data Configuration
data:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  image_size: [224, 224]
  augmentation: true
