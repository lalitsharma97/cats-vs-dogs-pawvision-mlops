name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Create dummy model for testing
        run: |
          python scripts/create_dummy_model.py

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create dummy model
        run: |
          python scripts/create_dummy_model.py

      - name: Build image with Docker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Test container locally
        run: |
          docker run -d -p 8000:8000 --name test-api ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 10
          docker exec test-api curl -f http://localhost:8000/health || exit 1
          docker stop test-api
          docker rm test-api

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image with Docker
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Image tag with commit SHA
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubernetes deployment with new image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_TAG|g" deployment/kubernetes/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment/kubernetes/
          kubectl rollout status deployment/cats-dogs-classifier --timeout=300s

      - name: Wait for deployment to be ready
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/cats-dogs-classifier

      - name: Get deployment status
        run: |
          kubectl get deployment cats-dogs-classifier
          kubectl get pods -l app=cats-dogs-classifier

      - name: Run smoke tests
        run: |
          python scripts/create_test_image.py
          python deployment/smoke_test.py

  deploy-docker-compose:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy with Docker Compose
        run: |
          cd deployment
          docker-compose pull
          docker-compose up -d

      - name: Wait for service to be ready
        run: |
          cd deployment
          sleep 30
          docker-compose ps

      - name: Run smoke tests
        run: |
          python scripts/create_test_image.py
          python deployment/smoke_test.py

      - name: Cleanup
        if: always()
        run: |
          cd deployment
          docker-compose down

  notify:
    needs: [deploy, deploy-docker-compose]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deployment status
        run: |
          echo "Deployment completed"
          echo "Kubernetes deployment: ${{ needs.deploy.result }}"
          echo "Docker Compose deployment: ${{ needs.deploy-docker-compose.result }}"
